<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compliance de Contrataciones</title>
  <link rel="stylesheet" href="/sandbox/static/estilos.css">
</head>
<body>
  <!-- Entrada: simula el inicio de sesión de la app (sin autenticación real). -->
  <section id="entrada" class="entrada" hidden>
    <form id="form-entrada" class="tarjeta">
      <h1>Compliance de Contrataciones</h1>
      <p class="sutil">Sandbox: funciona como la app. El historial se guarda en una carpeta de tu PC.</p>
      <label>Tu nombre<input id="in-nombre" required autocomplete="name"></label>
      <label>Ente<input id="in-ente" required placeholder="Alcaldía del Municipio Iribarren"></label>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <header class="barra">
      <strong>Compliance de Contrataciones</strong>
      <span id="quien" class="sutil"></span>
      <span class="espacio"></span>
      <button id="btn-carpeta" class="ligero" type="button">Historial en el navegador</button>
      <button id="btn-clave" class="ligero" type="button">Clave API</button>
      <button id="btn-exportar" class="ligero" type="button">Exportar respaldo</button>
      <button id="btn-salir" class="ligero" type="button">Cambiar usuario</button>
    </header>

    <aside class="lateral">
      <button id="btn-nuevo" type="button">+ Nuevo expediente</button>
      <h2>Mis expedientes</h2>
      <ul id="lista-expedientes" class="lista"></ul>
    </aside>

    <main class="chat">
      <div id="mensajes" class="mensajes"></div>
      <div id="acciones" class="acciones"></div>
      <form id="form-texto" class="entrada-texto" hidden>
        <input id="in-texto" autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
      <input id="in-archivo" type="file" hidden
             accept=".pdf,.docx,.xlsx,.xls,.png,.jpg,.jpeg,.tif,.tiff,.webp,.bmp">
    </main>

    <aside class="checklist">
      <h2>Documentos</h2>
      <div id="datos-expediente" class="sutil"></div>
      <ol id="lista-checklist" class="lista"></ol>
    </aside>
  </div>

  <dialog id="visor">
    <div class="visor-cabecera">
      <strong id="visor-titulo"></strong>
      <span class="espacio"></span>
      <button id="visor-descargar" class="ligero" type="button">Descargar .md</button>
      <button id="visor-cerrar" type="button">Cerrar</button>
    </div>
    <div id="visor-cuerpo" class="markdown"></div>
  </dialog>

  <script src="/sandbox/static/app.js"></script>
</body>
</html>
